[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babelt"
version = "0.5.0"
description = "Traduz man pages e saída de terminal do inglês para pt-BR, offline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["man", "manpage", "tradução", "translation", "pt-BR", "nmt", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# Só o que roda uma tradução. O modelo vem pronto, por download direto: nem
# huggingface-hub nem torch são necessários para usar o babelt.
dependencies = [
    "ctranslate2>=4.0,<5",
    "sentencepiece>=0.2,<0.3",
]

# Tiradas do remote `origin` deste repositório. Se o projeto for renomeado ou
# mudar de dono antes de publicar, estas três linhas mudam junto — e o
# MODEL_URL em babelt/model.py também.
[project.urls]
Homepage = "https://github.com/ONiceasNeto/babelt"
Changelog = "https://github.com/ONiceasNeto/babelt/blob/main/CHANGELOG.md"
Issues = "https://github.com/ONiceasNeto/babelt/issues"

[project.scripts]
babelt = "babelt.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]
# Só para gerar o artefato do modelo, com scripts/build-model.sh. Quem instala
# o babelt para usar nunca precisa disto.
convert = ["transformers>=4.40", "torch>=2.0", "huggingface-hub>=0.20"]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["babelt*"]

[tool.setuptools.package-data]
babelt = ["extensions.txt", "headers.txt", "glossary.txt", "literals.txt", "function_words.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: exige o modelo NMT baixado; pulado se ausente",
]

[tool.mypy]
# 3.12 e não 3.11 por causa da cadeia de stubs: `import pytest` arrasta os
# stubs do numpy, que usam sintaxe de 3.12 e não são analisáveis com
# python_version = 3.11. O piso de execução continua sendo 3.11
# (requires-python), e o pacote em si é verificado nesse piso com:
#     mypy --python-version 3.11 babelt
python_version = "3.12"
strict = true
files = ["babelt", "tests"]

# Nem ctranslate2 nem sentencepiece publicam stubs; numpy publica, mas os dele
# usam sintaxe de 3.12 e o projeto declara 3.11 como piso.
[[tool.mypy.overrides]]
module = ["ctranslate2", "ctranslate2.*", "sentencepiece", "sentencepiece.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
