name: Bug
description: babelt crashed, errored out, or did something it should not
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a translation that came out badly while the program worked, use
        **Bad translation** — that form asks for the right things.

        Reports in English, Portuguese or Spanish are all welcome.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands, in order, starting from a clean state if you know it.
      placeholder: |
        1. ./install.sh --no-model
        2. babelt ls
        3. hangs here
      render: text
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: >
        Paste everything that appeared, including the traceback if there is
        one. Do not trim it — the part that looks irrelevant is usually the
        one that matters.
      render: text
    validations:
      required: false

  - type: textarea
    id: doctor
    attributes:
      label: Output of `babelt doctor`
      description: >
        It diagnoses model, cache, libraries and `man`. If babelt cannot even
        run that, write what happened when you tried.
      render: text
    validations:
      required: false

  - type: input
    id: system
    attributes:
      label: Distro and Python version
      description: The output of `python3 --version` and the name of your distro.
      placeholder: Ubuntu 24.04, Python 3.12.3
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: babelt version
      placeholder: babelt 0.5.0
    validations:
      required: false
