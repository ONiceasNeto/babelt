name: Tradução ruim
description: Uma linha saiu errada, sem sentido, ou ficou em inglês sem motivo
title: "[tradução] "
labels: ["tradução", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        **Esta é a contribuição mais útil do projeto.** Cada exemplo de saída
        ruim é dado de qualidade que não existe em lugar nenhum.

        Você não precisa saber *por que* está errado. "Isso não faz sentido em
        português" é um relato completo.

  - type: input
    id: comando
    attributes:
      label: Qual comando você rodou?
      description: A linha inteira, do jeito que você digitou.
      placeholder: babelt tar
    validations:
      required: true

  - type: textarea
    id: saida
    attributes:
      label: O que saiu
      description: >
        Cole a parte errada. Algumas linhas antes e depois ajudam, mas não
        precisa colar a página inteira.
      render: text
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: O que está errado nisso
      description: >
        Em português comum. Se souber como deveria ter saído, escreva também —
        mas não é obrigatório.
      placeholder: |
        A frase diz "abra a tomada", mas "socket" aqui é o conceito de rede,
        não uma tomada elétrica.
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do babelt
      description: A saída de `babelt --version`.
      placeholder: babelt 0.5.0
    validations:
      required: false

  - type: textarea
    id: stats
    attributes:
      label: Saída de --stats (opcional)
      description: >
        Se puder, rode o mesmo comando com `--stats` e cole o resultado. Ele
        diz se a linha foi rejeitada pelo validador e por qual motivo, o que
        encurta muito a investigação.
      render: text
    validations:
      required: false
