name: Bad translation
description: A line came out wrong, meaningless, or stayed in English for no reason
title: "[translation] "
labels: ["translation", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most useful contribution to the project.** Every example
        of bad output is quality data that exists nowhere else.

        You do not need to know *why* it is wrong. "This makes no sense"
        is a complete report.

        Reports in English, Portuguese or Spanish are all welcome.

  - type: input
    id: command
    attributes:
      label: What command did you run?
      description: The whole line, exactly as you typed it.
      placeholder: babelt tar
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What came out
      description: >
        Paste the part that is wrong. A few lines before and after help, but
        there is no need to paste the whole page.
      render: text
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong with it
      description: >
        In plain words. If you know how it should have come out, write that
        too — but it is not required.
      placeholder: |
        The sentence says "abra a tomada", but "socket" here is the network
        concept, not an electrical outlet.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: babelt version
      description: The output of `babelt --version`.
      placeholder: babelt 0.5.0
    validations:
      required: false

  - type: textarea
    id: stats
    attributes:
      label: Output of --stats (optional)
      description: >
        If you can, run the same command with `--stats` and paste the result.
        It says whether the line was rejected by the validator and for which
        reason, which shortens the investigation a lot.
      render: text
    validations:
      required: false
